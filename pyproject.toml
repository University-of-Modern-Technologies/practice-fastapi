[project]
name = "practice-crm"
version = "1.0.0"
description = "Навчальна CRM: запуск стека, локальна розробка й обслуговування"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = ["poethepoet==0.48.0"]

[tool.uv]
package = false

[tool.poe.tasks]
setup = { cmd = "python scripts/stack.py setup", help = "Create .env files with fresh secrets and check the ports" }
start = { cmd = "python scripts/stack.py start", help = "Run the whole stack in Docker; the API reloads on save" }
stop = { cmd = "python scripts/stack.py stop", help = "Stop the stack; data is kept" }
"prod:start" = { cmd = "python scripts/stack.py prod:start", help = "Run the stack from production images" }
"prod:stop" = { cmd = "python scripts/stack.py prod:stop", help = "Stop the production stack; data is kept" }
build = { cmd = "python scripts/stack.py build", help = "Build the production images" }
test = { cmd = "python scripts/stack.py test", help = "Run the backend and web client test suites" }
"start:api" = { cmd = "python scripts/stack.py start:api", help = "Run only the API and its storage in Docker" }
"start:infra" = { cmd = "python scripts/stack.py start:infra", help = "Run only PostgreSQL, Redis and MongoDB" }
dev = { cmd = "python scripts/stack.py dev", help = "Run the API on this machine against start:infra" }
"dev:web" = { cmd = "python scripts/stack.py dev:web", help = "Run the web client on this machine with hot reload" }
logs = { cmd = "python scripts/stack.py logs", help = "Follow the logs; pass a service name to narrow" }
ps = { cmd = "python scripts/stack.py ps", help = "Show the state of each service" }
clean = { cmd = "python scripts/stack.py clean", help = "Stop the stack and delete the databases" }
tools = { cmd = "python scripts/stack.py tools", help = "Start Portainer for containers and logs" }
"db:migrate" = { cmd = "python scripts/stack.py db:migrate", help = "Apply migrations and the seed in Docker" }
"db:seed:demo" = { cmd = "python scripts/stack.py db:seed:demo", help = "Load the demonstration data set in Docker" }

[tool.ruff]
line-length = 100
target-version = "py313"
