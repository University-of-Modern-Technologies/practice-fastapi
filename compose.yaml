name: ${PROJECT_NAME:-practice-crm-python}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  nginx:
    container_name: ${PROJECT_NAME:-practice-crm-python}_nginx
    image: ${PROJECT_NAME:-practice-crm-python}_nginx:latest
    restart: unless-stopped
    build:
      context: ./etc/nginx
    environment:
      - TZ=Europe/Kyiv
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    networks:
      - ntw

  api:
    container_name: ${PROJECT_NAME:-practice-crm-python}_api
    image: ${PROJECT_NAME:-practice-crm-python}_api:latest
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    environment:
      TZ: Europe/Kyiv
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: http://localhost:${HTTP_PORT:-8080},http://localhost:${WEB_PORT:-3100}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-practice_crm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-practice_crm}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-crm:}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      MONGODB_URL: mongodb://${MONGO_USER:-practice_crm}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/${MONGO_DB:-practice_events}?authSource=admin
      EVENT_LOG_RETENTION_DAYS: ${EVENT_LOG_RETENTION_DAYS:-90}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      WS_PATH: ${WS_PATH:-/api/v1/realtime}
    ports:
      - '${API_PORT:-3000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 180s
    stop_grace_period: 20s
    logging: *logging
    networks:
      - ntw

  web:
    container_name: ${PROJECT_NAME:-practice-crm-python}_web
    image: ${PROJECT_NAME:-practice-crm-python}_web:latest
    restart: unless-stopped
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: ${WS_PATH:-/api/v1/realtime}
    environment:
      TZ: Europe/Kyiv
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '${WEB_PORT:-3100}:3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging: *logging
    networks:
      - ntw

  migrate:
    container_name: ${PROJECT_NAME:-practice-crm-python}_migrate
    image: ${PROJECT_NAME:-practice-crm-python}_migrate:latest
    build:
      context: ./backend
      target: runtime
    environment:
      TZ: Europe/Kyiv
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-practice_crm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-practice_crm}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Set SEED_USER_PASSWORD in .env}
      SEED_ALLOW_PRODUCTION: ${SEED_ALLOW_PRODUCTION:-false}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://${MONGO_USER:-practice_crm}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/${MONGO_DB:-practice_events}?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'alembic upgrade head && python -m scripts.seed']
    restart: 'no'
    logging: *logging
    networks:
      - ntw

  postgres:
    container_name: ${PROJECT_NAME:-practice-crm-python}_postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Kyiv
      POSTGRES_DB: ${POSTGRES_DB:-practice_crm}
      POSTGRES_USER: ${POSTGRES_USER:-practice_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks:
      - ntw

  redis:
    container_name: ${PROJECT_NAME:-practice-crm-python}_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks:
      - ntw

  mongo:
    container_name: ${PROJECT_NAME:-practice-crm-python}_mongo
    image: mongo:8
    restart: unless-stopped
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    environment:
      TZ: Europe/Kyiv
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-practice_crm}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-practice_events}
    volumes:
      - mongo_data:/data/db
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    networks:
      - ntw

  portainer:
    container_name: ${PROJECT_NAME:-practice-crm-python}_portainer
    image: portainer/portainer-ce:lts
    profiles: ['tools']
    restart: unless-stopped
    command: ['--admin-password-file', '/run/portainer/admin-password']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.portainer-password:/run/portainer/admin-password:ro
      - portainer_data:/data
    ports:
      - '127.0.0.1:${PORTAINER_PORT:-9000}:9000'
    logging: *logging
    networks:
      - ntw

networks:
  ntw:
    name: ${PROJECT_NAME:-practice-crm-python}

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-practice-crm-python}_postgres_data
  redis_data:
    name: ${PROJECT_NAME:-practice-crm-python}_redis_data
  mongo_data:
    name: ${PROJECT_NAME:-practice-crm-python}_mongo_data
  portainer_data:
    name: ${PROJECT_NAME:-practice-crm-python}_portainer_data
