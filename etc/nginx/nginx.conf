# `Connection: upgrade` only for a request that asks to be upgraded; every
# other request goes upstream as a plain HTTP/1.1 exchange.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    # A little above the API's JSON body limit (JSON_BODY_LIMIT_BYTES, 1 MiB by
    # default): a body between the two gets the API's own 413 in the standard
    # error envelope, only a far larger one is cut off here. Raise both together.
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $web http://web:3000;

    # nginx is the edge: what the client sent as X-Forwarded-For is replaced,
    # not appended to, so the API trusts exactly one hop (TRUSTED_PROXIES).
    # `$http_host` keeps the port the client used, so redirects stay on it.

    # The realtime channel. The path is fixed: the API (WS_PATH) and the web
    # client use the same default. The longer prefix wins over `/api/`, so the
    # socket gets the long timeouts below.
    location ^~ /api/v1/realtime {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
        proxy_buffering off;
    }

    # Everything the backend serves lives under /api; the rest is the web client.
    # The upgrade headers are passed here as well, so a socket on any other
    # path under /api still connects, only with the ordinary timeouts.
    location ^~ /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Build output: every file name carries a content hash, so a year is safe.
    # The upstream's own header is dropped, leaving exactly one policy.
    location /_next/static/ {
        proxy_pass $web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass $web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
